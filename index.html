<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>Welcome to Portofolio Han</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var originalTitle = "Welcome to Portofolio Han ";
        var currentTitle = originalTitle;
        
        function scrollTitle() {
          currentTitle = currentTitle.substring(1) + currentTitle.substring(0, 1);
          document.title = currentTitle;
        }
        
        setInterval(scrollTitle, 200);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
